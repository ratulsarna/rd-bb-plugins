[project]
name = "bb-speech-service"
version = "0.1.0"
description = "GPU speech-to-text and text-to-speech service for the BB voice POC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "faster-qwen3-tts>=0.3.2",
    "nano-parakeet>=0.2.1",
    "numpy>=2.0",
    "python-multipart>=0.0.20",
    "soundfile>=0.13",
    "torch>=2.12,<2.13",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["test_smoke.py"]
